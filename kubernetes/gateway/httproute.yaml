apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-demo
  namespace: mts-app
  labels:
    app.kubernetes.io/part-of: mts-engineer-hack
spec:
  hostnames: [mts.local]
  parentRefs:
    - name: mts-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx-demo
          port: 80
          weight: 1

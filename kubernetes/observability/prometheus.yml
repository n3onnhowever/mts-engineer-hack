global:
  scrape_interval: 15s
  scrape_timeout: 5s
scrape_configs:
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets: [prometheus.mts-observability.svc.cluster.local:9090]
  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: [loki.mts-observability.svc.cluster.local:3100]

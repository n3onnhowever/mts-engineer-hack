apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../app
  - prometheus.yaml
  - loki.yaml
configMapGenerator:
  - name: prometheus-config
    namespace: mts-observability
    files: [prometheus.yml]
  - name: loki-config
    namespace: mts-observability
    files: [loki.yml]
  - name: fluentd-config
    namespace: mts-app
    files: [fluent.conf]
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: mts-engineer-hack
patches:
  - path: nginx-fluentd-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: nginx-demo
      namespace: mts-app

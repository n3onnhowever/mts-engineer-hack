<system>
  workers 1
  log_level info
</system>

<source>
  @type tail
  @id nginx_access
  tag nginx.access
  path /var/log/nginx/access.json
  pos_file /fluentd/state/access.pos
  read_from_head true
  follow_inodes true
  refresh_interval 5s
  <parse>
    @type json
    # Keep Nginx's timestamp as a body field; use high-resolution ingestion time
    # for Loki so a query starting immediately before a request cannot miss it
    # because Nginx's $time_iso8601 has only second precision.
    time_key time
    estimate_current_event true
    types status:integer
  </parse>
</source>

<source>
  @type tail
  @id nginx_error
  tag nginx.error
  path /var/log/nginx/error.log
  pos_file /fluentd/state/error.pos
  read_from_head true
  follow_inodes true
  refresh_interval 5s
  <parse>
    @type none
    message_key message
  </parse>
</source>

<filter nginx.access>
  @type record_transformer
  <record>
    pod "#{ENV.fetch('POD_NAME')}"
    source_file /var/log/nginx/access.json
  </record>
</filter>

<filter nginx.error>
  @type record_transformer
  enable_ruby true
  <record>
    timestamp ${Time.now.utc.iso8601(9)}
    pod "#{ENV.fetch('POD_NAME')}"
    source_file /var/log/nginx/error.log
  </record>
</filter>

<match nginx.access>
  @type loki
  @id loki_access
  url http://loki.mts-observability.svc.cluster.local:3100
  line_format json
  extra_labels {"namespace":"mts-app","app":"nginx-demo","container":"nginx","collector":"fluentd","log_type":"access"}
  <buffer>
    @type file
    path /fluentd/state/access-buffer
    flush_mode interval
    flush_interval 2s
    flush_thread_count 1
    chunk_limit_size 1m
    total_limit_size 32m
    overflow_action block
    retry_forever true
    retry_type exponential_backoff
    retry_wait 1s
    retry_max_interval 30s
  </buffer>
</match>

<match nginx.error>
  @type loki
  @id loki_error
  url http://loki.mts-observability.svc.cluster.local:3100
  line_format json
  extra_labels {"namespace":"mts-app","app":"nginx-demo","container":"nginx","collector":"fluentd","log_type":"error"}
  <buffer>
    @type file
    path /fluentd/state/error-buffer
    flush_mode interval
    flush_interval 2s
    flush_thread_count 1
    chunk_limit_size 1m
    total_limit_size 32m
    overflow_action block
    retry_forever true
    retry_type exponential_backoff
    retry_wait 1s
    retry_max_interval 30s
  </buffer>
</match>

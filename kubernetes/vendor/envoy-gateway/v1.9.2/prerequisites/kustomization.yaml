apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Includes the webhook BEFORE certgen, which fills its caBundle from a Secret.
resources:
  - ../base
patches:
  - target:
      kind: CustomResourceDefinition|ValidatingAdmissionPolicy|ValidatingAdmissionPolicyBinding|Namespace|Deployment|Job
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: List
      metadata:
        name: phase-excluded

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Apply only after prerequisites; scripts/deploy.sh handles immutable Job reuse.
resources:
  - ../base
patches:
  - target:
      kind: CustomResourceDefinition|ValidatingAdmissionPolicy|ValidatingAdmissionPolicyBinding|Namespace|ServiceAccount|ConfigMap|ClusterRole|ClusterRoleBinding|Role|RoleBinding|Service|Deployment|MutatingWebhookConfiguration
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: List
      metadata:
        name: phase-excluded
